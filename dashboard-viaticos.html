// FIX 1: filBanco aplica los mismos filtros de mes/zona/semana que fil()
function filBanco(arr){

    (!f.zona||r.zona===f.zona)
  )
}

function esSemanaNuevaLogica(anio,mesIdx){ return anio>2026 || (anio===2026 && mesIdx>=7) }

function semanasDelMes(mes,anio){
  const MI=['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE']
  const mi=MI.indexOf(mes)
  if(mi<0)return[{n:1,d:1,h:7},{n:2,d:8,h:14},{n:3,d:15,h:21},{n:4,d:22,h:28}]
  if(!esSemanaNuevaLogica(anio,mi)){
    const dias=new Date(anio,mi+1,0).getDate()
    const ss=[{n:1,d:1,h:7},{n:2,d:8,h:14},{n:3,d:15,h:21},{n:4,d:22,h:Math.min(28,dias)}]
    if(dias>28)ss.push({n:5,d:29,h:dias})
    return ss
  }
  const last=new Date(anio,mi+1,0)
  let d=new Date(anio,mi,1)
  while(d.getDay()!==0)d.setDate(d.getDate()+1)
  const ss=[];let n=1
  while(d<=last){
    const dom=new Date(d),lun=new Date(d);lun.setDate(lun.getDate()-6)
    ss.push({n,dFull:lun,hFull:dom});n++;d.setDate(d.getDate()+7)
  }
  return ss
}
function labelSem(n,mes,anio){
  const mn=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic']
  const MI=['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE']
  const s=semanasDelMes(mes,anio).find(x=>x.n===n)
  if(!s)return'S'+n
  if(s.dFull)return'S'+n+': '+s.dFull.getDate()+' '+mn[s.dFull.getMonth()]+' — '+s.hFull.getDate()+' '+mn[s.hFull.getMonth()]
  const mi=MI.indexOf(mes)
  return'S'+n+': '+s.d+' '+mn[mi]+' — '+s.h+' '+mn[mi]
}
function semanaMesHoy(){
  const MESES=['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE']
  const hoy=new Date();hoy.setHours(0,0,0,0)
  for(const off of [0,1]){
    const d=new Date(hoy.getFullYear(),hoy.getMonth()+off,1)
    const mes=MESES[d.getMonth()],anio=d.getFullYear()
    const match=semanasDelMes(mes,anio).find(s=>s.dFull
      ? (hoy>=s.dFull&&hoy<=s.hFull)
      : (hoy>=new Date(anio,MESES.indexOf(mes),s.d)&&hoy<=new Date(anio,MESES.indexOf(mes),s.h)))
    if(match)return{semana:match.n,mes,anio}
  }
  const _d=hoy.getDate()
  return{semana:_d<=7?1:_d<=14?2:_d<=21?3:_d<=28?4:5,mes:MESES[hoy.getMonth()],anio:hoy.getFullYear()}
}

async function fetchAll(queryFn){
  const PAGE=1000
  let all=[],from=0
  while(true){
    const{data,error}=await queryFn().range(from,from+PAGE-1)
    if(error||!data||data.length===0)break
    all=all.concat(data)
    if(data.length<PAGE)break
    from+=PAGE
  }
  return all
}

async function loadAll(){
  S.loading=true;render()
  const esCoord=S.perfil&&S.perfil.rol==='coordinador'
  let tecQuery=sb.from('tecnicos').select('*,subsede:subsede_operativa,estado:estado_republica').eq('activo',true).order('nombre')
  if(esCoord&&S.perfil.nombre)tecQuery=tecQuery.ilike('coordinador',S.perfil.nombre)
  const[t,u,rv]=await Promise.all([
    tecQuery,
    sb.from('perfiles').select('*').order('nombre'),
    sb.from('rutas').select('ruta,region').eq('activo',true).order('region').order('ruta'),
  ])
  S.tecnicos=t.data||[]
  S.usuarios=u.data||[]
  S.rutas=rv.data||[]
  const[presupuestos,banco,dispersiones]=await Promise.all([
    fetchAll(()=>sb.from('presupuestos').select('*').order('creado_en',{ascending:false})),
    fetchAll(()=>sb.from('gastos_banco').select('*').order('creado_en',{ascending:false})),
    fetchAll(()=>sb.from('dispersiones').select('*').order('created_at',{ascending:false})),
  ])
  S.presupuestos=presupuestos
  S.banco=banco
  S.dispersiones=dispersiones
  try{const ch=await sb.from('ch_gastos').select('*').order('creado_en',{ascending:false}).limit(20000);S.chGastos=ch.data||[]}catch(e){S.chGastos=[]}
  S.loading=false
  const _rol=S.perfil?S.perfil.rol:null
  if((_rol==='vendedor'||_rol==='administracion')&&!['mis_solicitudes','captura','nueva_solicitud'].includes(S.page))S.page='nueva_solicitud'
  if(_rol==='coordinador'&&!['captura','mis_solicitudes','tecnicos'].includes(S.page))S.page='captura'
  render()
}

async function guardarDispersion(){

  if(!m)return

  if(!monto||monto<=0){alert('Ingresa un monto válido');return}
  if(monto>m.saldo+0.01){alert('El monto ('+fmt(monto)+') excede el saldo pendiente ('+fmt(m.saldo)+')');return}
  if(!m.fecha){alert('Selecciona la fecha de dispersión');return}
  const{data:{user}}=await sb.auth.getUser()
  const{error}=await sb.from('dispersiones').insert([{presupuesto_id:m.pid,monto_dispersado:monto,monto_solicitado:m.montoSolicitado,monto_autorizado:m.montoAutorizado,motivo_ajuste:m.motivoAjuste||null,fecha:m.fecha,usuario_id:user.id,usuario_nombre:S.perfil?S.perfil.nombre:'',nota:m.nota||null}])
  if(error){alert('Error al guardar dispersión: '+error.message);return}
  const nuevoTotal=m.totalDisp+monto
  const nuevoEst=nuevoTotal>=m.montoTotal-0.01?'dispersado':'parcial'
  await sb.from('presupuestos').update({
    estado_dispersion:nuevoEst,
    fecha_dispersado:nuevoEst==='dispersado'?new Date().toISOString():null,
    dispersado_por:nuevoEst==='dispersado'?(S.perfil?S.perfil.nombre:''):null
  }).eq('id',m.pid)

  await loadAll()
}

async function guardarPresupuesto(){
  if(S.lineas.length===0)return
  const p=S.perfil
  const c=S.cap
  if(!c.fecha_dispersion){S.capMsg={t:'e',m:'Indica cuándo necesitas el dinero (fecha de dispersión)'};render();return}
  const esDirecto=p&&(p.rol==='vendedor'||p.rol==='administracion')
  let tecId,tecNombre,tecZona,tecCiudad='',tecUdn='',tecCoord=''
  if(esDirecto){
    tecId=S.user.id;tecNombre=p.nombre;tecZona=p.zona||'MATRIZ'
  } else {
    if(!c.tid){S.capMsg={t:'e',m:'Selecciona un técnico'};render();return}
    const tec=S.tecnicos.find(t=>t.id===c.tid)
    if(!tec){S.capMsg={t:'e',m:'Técnico no encontrado'};render();return}
    tecId=tec.id;tecNombre=tec.nombre;tecZona=tec.zona;tecCiudad=tec.ciudad||'';tecUdn=tec.udn||'';tecCoord=tec.coordinador||''
  }
  const rows=S.lineas.map(l=>({
    semana:parseInt(c.semana),mes:c.mes,anio:parseInt(c.anio),
    tipo:esDirecto?'EXTRA':c.tipo,tecnico_id:tecId,tecnico_nombre:tecNombre,
    zona:tecZona,ciudad:tecCiudad,udn:tecUdn,coordinador:tecCoord,
    concepto:l.concepto,monto:l.monto,local_viaje:l.lv,
    comentarios:c.nota||null,coordinador_id:S.user.id,estado:'PENDIENTE',
    fecha_dispersion:c.fecha_dispersion,estado_dispersion:'pendiente',
    fecha_inicio_viaje:c.fecha_inicio_viaje||null,fecha_fin_viaje:c.fecha_fin_viaje||null,
    ruta:c.ruta||null
  }))
  const{error}=await sb.from('presupuestos').insert(rows)
  if(error){S.capMsg={t:'e',m:error.message};render();return}
  const total=S.lineas.reduce((a,l)=>a+l.monto,0)
  S.capMsg={t:'o',m:rows.length+' concepto(s) guardados · Total: '+fmt(total)}
  S.lineas=[];S.cap={...S.cap,tid:'',nota:'',fecha_dispersion:'',fecha_inicio_viaje:'',fecha_fin_viaje:'',ruta:''}
  setTimeout(()=>{S.capMsg=null;render()},4000)
  await loadAll()
}

async function generarPresupuestosFijos(){
  if(S.generandoFijos)return
  S.generandoFijos=true
  S.capMsg={t:'o',m:'Generando presupuestos fijos...'}
  render()
  const{semana,mes,anio}=semanaMesHoy()
  const{data:fijos,error:ef}=await sb.from('presupuestos_fijos').select('*').eq('activo',true)
  if(ef){S.capMsg={t:'e',m:'Error leyendo fijos: '+ef.message};S.generandoFijos=false;render();return}
  if(!fijos||fijos.length===0){S.capMsg={t:'e',m:'No hay presupuestos fijos activos.'};S.generandoFijos=false;render();return}
  let generados=0,omitidos=0
  for(const f of fijos){
    const{data:dup}=await sb.from('presupuestos').select('id')
      .eq('tecnico_nombre',f.tecnico_nombre).eq('concepto',f.concepto)
      .eq('semana',semana).eq('mes',mes).eq('anio',anio).limit(1)
    if(dup&&dup.length>0){omitidos++;continue}
    const{error:ei}=await sb.from('presupuestos').insert([{
      semana,mes,anio,tipo:'PRESUPUESTADO',
      tecnico_nombre:f.tecnico_nombre,zona:f.zona,ciudad:f.ciudad,
      concepto:f.concepto,monto:f.monto,local_viaje:f.local_viaje,
      coordinador_id:S.user.id,estado:'PENDIENTE'
    }])
    if(ei)omitidos++
    else generados++
  }
  S.capMsg={t:'o',m:'✓ '+generados+' generados · '+omitidos+' ya existían'}
  S.generandoFijos=false
  setTimeout(()=>{S.capMsg=null;render()},5000)
  await loadAll()
}

  if(!mp)return 0
  if(cat.includes('RECLUT'))return mp.RECLUTAMIENTO||0
  if(cat.includes('EVENTO'))return mp.EVENTOS||0
  if(cat.includes('CAPAC'))return mp.CAPACITACION||0
  if(cat.includes('HONOR'))return mp.HONORARIOS||0
  if(cat.includes('SISTEM'))return mp.SISTEMAS||0
  if(cat.includes('UNIFORM'))return mp.UNIFORMES||0
  if(cat.includes('COMUNI'))return mp.COMUNICACION||0
  return mp.OTROS||0
}

function pAprobacionCH(){

  const pend=S.chGastos.filter(r=>r.estado==='PENDIENTE').length
  const apro=S.chGastos.filter(r=>r.estado==='APROBADO').length
  const rech=S.chGastos.filter(r=>r.estado==='RECHAZADO').length

    '<div class="kpi red"><div class="kl">Rechazados</div><div class="kv" style="color:var(--red)">'+rech+'</div></div>'+
    '</div>'+
    '<div class="flt">'+
    '<select class="fs" onchange="S.chAfe=this.value;render()"><option value="">Todos</option><option value="PENDIENTE"'+(S.chAfe==='PENDIENTE'?' selected':'')+'>Pendientes</option><option value="APROBADO"'+(S.chAfe==='APROBADO'?' selected':'')+'>Aprobados</option><option value="RECHAZADO"'+(S.chAfe==='RECHAZADO'?' selected':'')+'>Rechazados</option></select>'+

// ── CSV Export ──
function csvDownload(filename,rows){
  const BOM='\uFEFF'
  const csv=BOM+rows.map(r=>r.map(c=>{const s=String(c===null||c===undefined?'':c);return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.replace(/"/g,'""')+'"':s}).join(',')).join('\n')
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=filename;a.click()
}
function csvPresupuestos(){
  const data=fil(S.presupuestos)
  csvDownload('presupuestos_'+(S.f.mes||'TodoElAno')+(S.f.zona?'_'+S.f.zona:'')+'.csv',[['Semana','Mes','Tipo','Tecnico','Zona','Ciudad','UDN','Ruta','Concepto','Monto','Estado','Comentarios'],...data.map(r=>[r.semana,r.mes,r.tipo||'',r.tecnico_nombre,r.zona,r.ciudad||'',r.udn||'',r.ruta||'SIN RUTA',r.concepto,r.monto,r.estado,r.comentarios||''])])
}
function csvPorZona(){
  const data=fil(S.presupuestos);const banco=filBanco(S.banco);const z={}
  data.forEach(r=>{if(!z[r.zona])z[r.zona]={z:r.zona,p:0,g:0};z[r.zona].p+=r.monto})
  banco.forEach(r=>{if(r.zona&&z[r.zona])z[r.zona].g+=(r.monto||0)})
  csvDownload('por_zona_'+(S.f.mes||'TodoElAno')+'.csv',[['Zona','Presupuesto','Gasto','Diferencia','% Avance'],...Object.values(z).sort((a,b)=>b.p-a.p).map(r=>[r.z,r.p,r.g,r.p-r.g,pct(r.g,r.p)+'%'])])
}

function csvTotalesMes(){
  const head=['Mes','Presupuesto','Gasto','Diferencia','% Avance','Pendientes','Aprobados','Rechazados']
  const rows=MESES.map(mes=>{const dp=S.presupuestos.filter(r=>r.mes===mes);const db=S.banco.filter(r=>r.mes===mes);const p=dp.reduce((a,r)=>a+r.monto,0),g=db.reduce((a,r)=>a+(r.monto||0),0);return[mes,p,g,p-g,pct(g,p)+'%',dp.filter(r=>r.estado==='PENDIENTE').length,dp.filter(r=>r.estado==='APROBADO').length,dp.filter(r=>r.estado==='RECHAZADO').length]}).filter(r=>r[1]>0||r[2]>0)
  csvDownload('totales_por_mes.csv',[head,...rows])
}

function xlsxDown(filename,headers,rows){
  if(typeof XLSX==='undefined'){alert('Librería Excel no cargada, intenta de nuevo');return}
  const ws=XLSX.utils.aoa_to_sheet([headers,...rows])
  const wb=XLSX.utils.book_new()
  XLSX.utils.book_append_sheet(wb,ws,'Datos')
  XLSX.writeFile(wb,filename)
}

function xlsxAprobacion(){
  let data=S.presupuestos
  if(S.perfil&&S.perfil.rol==='coordinador'){const _ns=new Set(S.tecnicos.map(t=>t.nombre));data=data.filter(r=>_ns.has(r.tecnico_nombre))}
  if(S.afe)data=data.filter(r=>r.estado===S.afe)
  if(S.afz)data=data.filter(r=>r.zona===S.afz)
  if(S.afb)data=data.filter(r=>r.tecnico_nombre.toLowerCase().includes(S.afb.toLowerCase()))
  if(S.afe!=='PENDIENTE'&&(S.afd_desde||S.afd_hasta))data=data.filter(r=>{if(!r.fecha_dispersion)return true;if(S.afd_desde&&r.fecha_dispersion<S.afd_desde)return false;if(S.afd_hasta&&r.fecha_dispersion>S.afd_hasta)return false;return true})
  if(S.afed)data=data.filter(r=>(r.estado_dispersion||'pendiente')===S.afed)
  data=[...data].sort((a,b)=>(!a.fecha_dispersion&&!b.fecha_dispersion)?0:!a.fecha_dispersion?1:!b.fecha_dispersion?-1:a.fecha_dispersion<b.fecha_dispersion?-1:1)
  xlsxDown('aprobacion'+(S.afe?'_'+S.afe:'')+'.xlsx',
    ['Semana','Mes','Técnico','Zona','UDN','Coordinador','Ruta','Concepto','Monto autorizado','Estado','Estado dispersión','Total dispersado','Saldo pendiente','Fecha necesidad','Fecha inicio viaje','Fecha fin viaje','Comentarios'],
    data.map(r=>[r.semana,r.mes,r.tecnico_nombre,r.zona,r.udn||'',r.coordinador||'',r.ruta||'',r.concepto,r.monto,r.estado,r.estado_dispersion||'pendiente',getTotalDisp(r.id),getSaldoPend(r),r.fecha_dispersion||'',r.fecha_inicio_viaje||'',r.fecha_fin_viaje||'',r.comentarios||''])
  )
}
function xlsxComparativo(){
  let pres=S.presupuestos
  if(S.f2.mes)pres=pres.filter(r=>r.mes===S.f2.mes)
  if(S.f2.concepto)pres=pres.filter(r=>r.concepto===S.f2.concepto)
  let banco2=S.banco
  if(S.f2.mes)banco2=banco2.filter(r=>r.mes===S.f2.mes)
  const map={}
  pres.forEach(r=>{if(!map[r.tecnico_nombre])map[r.tecnico_nombre]={t:r.tecnico_nombre,z:r.zona,c:r.coordinador||'',p:0,g:0};map[r.tecnico_nombre].p+=r.monto})
  banco2.forEach(r=>{if(map[r.tecnico_nombre])map[r.tecnico_nombre].g+=(r.monto||0)})
  const rf=Object.values(map).sort((a,b)=>b.p-a.p)
    .filter(r=>(!S.f2.zona||r.z===S.f2.zona)&&(!S.f2.tecnico||r.t.toLowerCase().includes(S.f2.tecnico.toLowerCase()))&&(!S.f2.coordinador||r.c.toLowerCase().includes(S.f2.coordinador.toLowerCase())))
  xlsxDown('comparativo_banco'+(S.f2.mes?'_'+S.f2.mes:'')+'.xlsx',
    ['Tecnico','Zona','Coordinador','Presupuesto','Gasto banco','Diferencia','% Avance','Estado'],
    rf.map(r=>{const d=r.p-r.g,p2=pct(r.g,r.p);return[r.t,r.z,r.c,r.p,r.g,d,p2+'%',r.g>r.p?'Excedido':p2>85?'Alerta':'OK']})
  )
}

  const data=fil(S.presupuestos)

  const totP=data.reduce((a,r)=>a+r.monto,0)
  const totG=banco.reduce((a,r)=>a+(r.monto||0),0)
  const dif=totP-totG
  const pend=data.filter(r=>r.estado==='PENDIENTE').length
  const apro=data.filter(r=>r.estado==='APROBADO').length
  const rech=data.filter(r=>r.estado==='RECHAZADO').length

  // Etiqueta del filtro activo
  const filtroLabel=S.f.mes?(S.f.mes.charAt(0)+S.f.mes.slice(1).toLowerCase()+(S.f.zona?' · '+S.f.zona:'')):(S.f.zona?S.f.zona:'Todo el año')

  const zonas={}
  data.forEach(r=>{if(!zonas[r.zona])zonas[r.zona]={p:0,g:0};zonas[r.zona].p+=r.monto})
  banco.forEach(r=>{if(r.zona&&zonas[r.zona])zonas[r.zona].g+=(r.monto||0)})
  const concs={}
  data.forEach(r=>{if(!concs[r.concepto])concs[r.concepto]={p:0,g:0};concs[r.concepto].p+=r.monto})
  banco.forEach(r=>{if(r.concepto&&concs[r.concepto])concs[r.concepto].g+=(r.monto||0)})
  const topC=Object.entries(concs).sort((a,b)=>b[1].p-a[1].p).slice(0,6)
  const tecs={}
  data.forEach(r=>{if(!tecs[r.tecnico_nombre])tecs[r.tecnico_nombre]={p:0,g:0,zona:r.zona,udn:r.udn||'',est:r.estado};tecs[r.tecnico_nombre].p+=r.monto})

  const MESES_ANUAL=['ENERO','FEBRERO','MARZO','ABRIL','MAYO']
  const anualP={},anualG={}

      '<td style="font-size:12px;font-weight:600">'+m.charAt(0)+m.slice(1).toLowerCase()+'</td>'+
      '<td style="text-align:right;font-weight:600;font-size:12px">'+fmt(p)+'</td>'+

      '<td style="text-align:right;font-size:12px;color:var(--g600)">'+pct(g,p)+'%</td>'+
      '</tr>'}).join('')+

function pAprobacion(){
  let data=S.presupuestos
  if(S.perfil&&S.perfil.rol==='coordinador'){const _ns=new Set(S.tecnicos.map(t=>t.nombre));data=data.filter(r=>_ns.has(r.tecnico_nombre))}
  if(S.afe)data=data.filter(r=>r.estado===S.afe)
  if(S.afz)data=data.filter(r=>r.zona===S.afz)
  if(S.afb)data=data.filter(r=>r.tecnico_nombre.toLowerCase().includes(S.afb.toLowerCase()))
  if(S.afe!=='PENDIENTE'&&(S.afd_desde||S.afd_hasta))data=data.filter(r=>{
    if(!r.fecha_dispersion)return true
    if(S.afd_desde&&r.fecha_dispersion<S.afd_desde)return false
    if(S.afd_hasta&&r.fecha_dispersion>S.afd_hasta)return false
    return true
  })
  if(S.afed)data=data.filter(r=>(r.estado_dispersion||'pendiente')===S.afed)
  data=[...data].sort((a,b)=>{
    if(!a.fecha_dispersion&&!b.fecha_dispersion)return 0
    if(!a.fecha_dispersion)return 1
    if(!b.fecha_dispersion)return -1
    return a.fecha_dispersion<b.fecha_dispersion?-1:a.fecha_dispersion>b.fecha_dispersion?1:0
  })
  const pend=S.presupuestos.filter(r=>r.estado==='PENDIENTE').length
  const apro=S.presupuestos.filter(r=>r.estado==='APROBADO').length
  const rech=S.presupuestos.filter(r=>r.estado==='RECHAZADO').length
  const porDispersar=S.presupuestos.filter(r=>r.estado==='APROBADO'&&['pendiente','parcial'].includes(r.estado_dispersion||'pendiente')).length
  const sel=S.sel
  const totSel=Array.from(sel).reduce((a,id)=>{const r=S.presupuestos.find(r=>r.id===id);return a+(r?r.monto:0)},0)
  const esAdmin=S.perfil&&S.perfil.rol==='admin'

  return '<div class="pg-t">Aprobación de presupuestos</div>'+
    '<div class="pg-s">Autoriza o rechaza solicitudes pendientes de aprobación</div>'+
    '<div class="kpig">'+

    '<div class="kpi grn"><div class="kl">Aprobados</div><div class="kv" style="color:var(--green)">'+apro+'</div></div>'+
    '<div class="kpi red"><div class="kl">Rechazados</div><div class="kv" style="color:var(--red)">'+rech+'</div></div>'+
    '<div class="kpi '+(porDispersar>0?'amb':'grn')+'"><div class="kl">Por dispersar</div><div class="kv" style="color:'+(porDispersar>0?'var(--amber)':'var(--green)')+'">'+porDispersar+'</div><div class="ks">aprobados sin dispersar</div></div>'+
    '</div>'+
    '<div class="flt">'+
    '<select class="fs" onchange="S.afe=this.value;render()"><option value="">Todos</option><option value="PENDIENTE"'+(S.afe==='PENDIENTE'?' selected':'')+'>Pendientes</option><option value="APROBADO"'+(S.afe==='APROBADO'?' selected':'')+'>Aprobados</option><option value="RECHAZADO"'+(S.afe==='RECHAZADO'?' selected':'')+'>Rechazados</option></select>'+
    '<select class="fs" onchange="S.afz=this.value;render()"><option value="">Todas las zonas</option>'+ZONAS.map(z=>'<option value="'+z+'"'+(S.afz===z?' selected':'')+'>'+z+'</option>').join('')+'</select>'+
    '<input class="fin" placeholder="Buscar técnico..." value="'+(S.afb||'')+'" onchange="S.afb=this.value;render()">'+
    '<input type="date" class="fin" title="Desde" value="'+(S.afd_desde||'')+'" onchange="S.afd_desde=this.value;render()" style="width:150px">'+
    '<input type="date" class="fin" title="Hasta" value="'+(S.afd_hasta||'')+'" onchange="S.afd_hasta=this.value;render()" style="width:150px">'+
    '<select class="fs" onchange="S.afed=this.value;render()"><option value="">Todas las dispersiones</option><option value="pendiente"'+(S.afed==='pendiente'?' selected':'')+'>Sin dispersar</option><option value="parcial"'+(S.afed==='parcial'?' selected':'')+'>Parcialmente dispersado</option><option value="dispersado"'+(S.afed==='dispersado'?' selected':'')+'>Dispersado</option></select>'+
    (S.perfil&&['admin','supervisor'].includes(S.perfil.rol)?'<button class="btn btn-sm" onclick="xlsxAprobacion()" style="border-color:#BBF7D0;color:#15803D;font-weight:600;margin-left:4px">📊 Descargar Excel</button>':'')+
    '</div>'+
    (sel.size>0?'<div class="abar">'+

function pComparativo(){
  let pres=S.presupuestos
  if(S.f2.mes)pres=pres.filter(r=>r.mes===S.f2.mes)
  if(S.f2.concepto)pres=pres.filter(r=>r.concepto===S.f2.concepto)
  let banco2=S.banco
  if(S.f2.mes)banco2=banco2.filter(r=>r.mes===S.f2.mes)
  const map={}
  pres.forEach(r=>{if(!map[r.tecnico_nombre])map[r.tecnico_nombre]={t:r.tecnico_nombre,z:r.zona,c:r.coordinador||'',p:0,g:0};map[r.tecnico_nombre].p+=r.monto})
  banco2.forEach(r=>{if(map[r.tecnico_nombre])map[r.tecnico_nombre].g+=(r.monto||0)})
  const rows=Object.values(map).sort((a,b)=>b.p-a.p)
  const totP=rows.reduce((a,r)=>a+r.p,0)
  const totG=rows.reduce((a,r)=>a+r.g,0)
  const exc=rows.filter(r=>r.g>r.p).length
  const rf=rows.filter(r=>(!S.f2.zona||r.z===S.f2.zona)&&(!S.f2.tecnico||r.t.toLowerCase().includes(S.f2.tecnico.toLowerCase()))&&(!S.f2.coordinador||r.c.toLowerCase().includes(S.f2.coordinador.toLowerCase())))

  return '<div class="pg-t">Comparativo banco</div>'+
    '<div class="pg-s">Presupuesto asignado vs gasto real del banco</div>'+
    '<div class="kpig">'+
    '<div class="kpi acc"><div class="kl">Total presupuestado</div><div class="kv">'+fmt(totP)+'</div></div>'+
    '<div class="kpi"><div class="kl">Total gastado</div><div class="kv">'+fmt(totG)+'</div></div>'+
    '<div class="kpi '+(totP>=totG?'grn':'red')+'"><div class="kl">Diferencia neta</div><div class="kv '+(totP>=totG?'pos':'neg')+'">'+( totP>=totG?'+':'')+fmt(totP-totG)+'</div></div>'+
    '<div class="kpi '+(exc>0?'red':'grn')+'"><div class="kl">Técnicos excedidos</div><div class="kv" style="color:'+(exc>0?'var(--red)':'var(--green)')+'">'+exc+'</div></div>'+
    '</div>'+
    (S.banco.length===0?'<div class="notice"><strong>Sin datos del banco</strong> · Cuando tengas el reporte bancario, el administrador puede cargarlo para activar este comparativo.</div>':'')+
    '<div class="card">'+
    '<div class="ch"><div><div class="ct">Detalle por técnico</div><div class="cs">'+rf.length+' técnicos</div></div>'+
    (S.perfil&&['admin','supervisor','coordinador'].includes(S.perfil.rol)?'<button class="btn btn-sm" onclick="xlsxComparativo()" style="border-color:#BBF7D0;color:#15803D;font-weight:600">📊 Descargar Excel</button>':'')+
    '</div>'+
    '<div class="flt" style="margin-top:10px;flex-wrap:wrap">'+
    '<select class="fs" onchange="S.f2.mes=this.value;render()"><option value="">Todos los meses</option>'+MESES.map(m=>'<option value="'+m+'"'+(S.f2.mes===m?' selected':'')+'>'+m.charAt(0)+m.slice(1).toLowerCase()+'</option>').join('')+'</select>'+
    '<select class="fs" onchange="S.f2.zona=this.value;render()"><option value="">Todas las zonas</option>'+ZONAS.map(z=>'<option value="'+z+'"'+(S.f2.zona===z?' selected':'')+'>'+z+'</option>').join('')+'</select>'+
    '<select class="fs" onchange="S.f2.concepto=this.value;render()"><option value="">Todos los conceptos</option>'+CONCEPTOS.map(c=>'<option value="'+c+'"'+(S.f2.concepto===c?' selected':'')+'>'+c+'</option>').join('')+'</select>'+

  await sb.from('perfiles').delete().eq('id',id)

}

function abrirImportExcel(){
  const inp=document.createElement('input')
  inp.type='file';inp.accept='.xlsx,.xls'
  inp.onchange=e=>procesarExcel(e.target.files[0])
  inp.click()
}

async function procesarExcel(file){
  if(!file)return
  if(typeof XLSX==='undefined'){alert('La librería Excel no está cargada aún, intenta de nuevo');return}
  const data=await file.arrayBuffer()
  const wb=XLSX.read(data,{type:'array'})
  const ws=wb.Sheets[wb.SheetNames[0]]
  const rows=XLSX.utils.sheet_to_json(ws,{defval:''})
  const norm=rows.map(r=>{
    const k={}
    Object.keys(r).forEach(key=>k[key.toLowerCase().trim()]=String(r[key]||'').trim())
    return{nombre:k.nombre||'',email:k.email||'',rol:k.rol||'coordinador',zona:k.zona||''}
  }).filter(r=>r.email&&r.nombre)
  if(norm.length===0){alert('No se encontraron filas válidas. Verifica que el archivo tenga columnas: nombre, email, rol, zona');return}
  S.importPreview=norm;S.importProgress=null;render()
}

async function confirmarImport(){
  const rows=S.importPreview
  S.importPreview=null
  S.importProgress={current:0,total:rows.length,ok:0,fail:0,log:[]}
  render()
  for(const row of rows){
    S.importProgress.current++
    render()
    const{error}=await sb.auth.signUp({email:row.email,password:'Avantex2026!',options:{data:{nombre:row.nombre,rol:row.rol,zona:row.zona||null}}})
    if(error){
      S.importProgress.fail++
      S.importProgress.log.push({email:row.email,ok:false,msg:error.message})
    }else{
      S.importProgress.ok++
      S.importProgress.log.push({email:row.email,ok:true})
    }
    render()
  }
  await loadAll()
}

function abrirEditPres(id){
  if(S.editPres===id){S.editPres=null;S.editPresData={}}
  else{S.editPres=id;S.editPresData={...S.presupuestos.find(r=>r.id===id)}}
  render()
}

async function guardarEditPres(){
  const d=S.editPresData
  if(!d.concepto||!d.monto){alert('Completa concepto y monto');return}
  const{error}=await sb.from('presupuestos').update({
    semana:parseInt(d.semana),
    mes:d.mes,
    concepto:d.concepto,
    monto:parseFloat(d.monto),
    local_viaje:d.local_viaje||'LOCAL',
    comentarios:d.comentarios||null,
  }).eq('id',S.editPres)
  if(error){alert('Error: '+error.message);return}
  S.editPres=null;S.editPresData={}
  await loadAll()
}

async function guardarNuevaSolicitud(){
  if(S.lineas.length===0)return
  const p=S.perfil
  const ns=S.ns
  if(!ns.fecha_dispersion){S.nsMsg={t:'e',m:'Indica cuándo necesitas el dinero (fecha de dispersión)'};render();return}
  const esDirecto=p&&(p.rol==='vendedor'||p.rol==='administracion')
  let tecId,tecNombre,tecZona,tecCiudad='',tecUdn='',tecCoord=''
  if(esDirecto){
    tecId=S.user.id;tecNombre=p.nombre;tecZona=p.zona||'MATRIZ'
  } else {
    if(!ns.tid){S.nsMsg={t:'e',m:'Selecciona un técnico'};render();return}
    const tec=S.tecnicos.find(t=>t.id===ns.tid)
    if(!tec){S.nsMsg={t:'e',m:'Técnico no encontrado'};render();return}
    tecId=tec.id;tecNombre=tec.nombre;tecZona=tec.zona;tecCiudad=tec.ciudad||'';tecUdn=tec.udn||'';tecCoord=tec.coordinador||''
  }
  const rows=S.lineas.map(l=>({
    semana:parseInt(ns.semana),mes:ns.mes,anio:parseInt(ns.anio||new Date().getFullYear()),
    tipo:'EXTRA',tecnico_id:tecId,tecnico_nombre:tecNombre,
    zona:tecZona,ciudad:tecCiudad,udn:tecUdn,coordinador:tecCoord,
    concepto:l.concepto,monto:l.monto,local_viaje:l.lv,
    comentarios:ns.nota||null,coordinador_id:S.user.id,estado:'PENDIENTE',
    fecha_dispersion:ns.fecha_dispersion,estado_dispersion:'pendiente',
    fecha_inicio_viaje:ns.fecha_inicio_viaje||null,fecha_fin_viaje:ns.fecha_fin_viaje||null,
    ruta:ns.ruta||null
  }))
  const{error}=await sb.from('presupuestos').insert(rows)
  if(error){S.nsMsg={t:'e',m:error.message};render();return}
  const total=S.lineas.reduce((a,l)=>a+l.monto,0)
  S.nsMsg={t:'o',m:rows.length+' concepto(s) guardados · Total: '+fmt(total)}
  S.lineas=[];S.ns={...S.ns,tid:'',nota:'',fecha_dispersion:'',fecha_inicio_viaje:'',fecha_fin_viaje:'',ruta:''}
  setTimeout(()=>{S.nsMsg=null;render()},4000)
  await loadAll()
}

let _charts={}
function initResumenCharts(){
  Object.values(_charts).forEach(c=>{try{c.destroy()}catch(e){}})
  _charts={}
  if(typeof Chart==='undefined')return
  const MALL=['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE']
  const aP={},aG={}
  S.presupuestos.forEach(r=>{aP[r.mes]=(aP[r.mes]||0)+r.monto})
  S.banco.forEach(r=>{aG[r.mes]=(aG[r.mes]||0)+(r.monto||0)})
  const tickFmt=v=>'$'+Math.round(v/1000)+'k'
  const gridColor='#F0F2F5'
  const c1=document.getElementById('ch-meses')
  if(c1)_charts.meses=new Chart(c1,{type:'bar',data:{labels:MALL.map(m=>m.slice(0,3)),datasets:[{label:'Presupuesto',data:MALL.map(m=>aP[m]||0),backgroundColor:'#BFDBFE',borderColor:'#3B82F6',borderWidth:1,borderRadius:3},{label:'Gasto',data:MALL.map(m=>aG[m]||0),backgroundColor:'#002B5C',borderColor:'#002B5C',borderWidth:1,borderRadius:3}]},options:{responsive:true,plugins:{legend:{position:'bottom',labels:{font:{size:10},boxWidth:10}}},scales:{y:{ticks:{callback:tickFmt,font:{size:9}},grid:{color:gridColor}},x:{ticks:{font:{size:9}},grid:{display:false}}}}})
  const zonaG={};S.banco.forEach(r=>{if(r.zona)zonaG[r.zona]=(zonaG[r.zona]||0)+(r.monto||0)})

  const top5=Object.entries(tecG).sort((a,b)=>b[1]-a[1]).slice(0,5)

}

    root.innerHTML='<div class="app">'+sidebar()+'<div class="main"><div class="ldr"><div class="ring"></div><div style="font-size:13px;color:var(--g600)">Cargando datos...</div></div></div></div>'
    return
  }

  const labels={resumen:'Resumen ejecutivo',captura:'Captura de presupuesto',aprobacion:'Aprobación',comparativo:'Comparativo banco',tecnicos:'Técnicos',usuarios:'Usuarios',ch_resumen:'CH — Resumen',ch_captura:'CH — Captura de gasto',ch_aprobacion:'CH — Aprobación',mis_solicitudes:'Mis Solicitudes',nueva_solicitud:'Solicitud Extra'}
  const pages={resumen:pResumen,captura:pCaptura,aprobacion:pAprobacion,comparativo:pComparativo,tecnicos:pTecnicos,usuarios:pUsuarios,ch_resumen:pResumenCH,ch_captura:pCapturaCH,ch_aprobacion:pAprobacionCH,mis_solicitudes:pMisSolicitudes,nueva_solicitud:pNuevaSolicitud}
  const pageHtml=(pages[S.page]||pResumen)()

  root.innerHTML='<div class="app">'+sidebar()+
    '<div class="main">'+
    '<div class="topbar">'+
    '<div><div style="font-size:15px;font-weight:600;color:var(--g900)">'+(labels[S.page]||'Dashboard')+'</div>'+
    '<div style="font-size:11px;color:var(--g400)">Grupo Avantex · Control de Viáticos 2026</div></div>'+
    '<span style="background:var(--navyL);color:var(--navy);font-size:12px;font-weight:500;padding:4px 12px;border-radius:20px">Política vigente: Feb 2026</span>'+
    '</div>'+
    '<div class="content">'+pageHtml+'</div>'+
    '</div></div>'

  if(S.page==='captura'||S.page==='nueva_solicitud') renderLineas()
  if(S.page==='resumen') setTimeout(initResumenCharts,0)
}

async function doL(){
  const e=document.getElementById('le').value
  const p=document.getElementById('lp').value
  const btn=document.getElementById('lb')
  const err=document.getElementById('ae')
  btn.disabled=true;btn.textContent='Verificando...'
  try{const error=await login(e,p);if(error){err.innerHTML='<div class="err-msg">'+error+'</div>';btn.disabled=false;btn.textContent='Iniciar sesión'}}catch(ex){err.innerHTML='<div class="err-msg">Error: '+ex.message+'</div>';btn.disabled=false;btn.textContent='Iniciar sesión'}
}

render()
sb.auth.getSession().then(function(r){
  var session=r.data.session
  if(session&&session.user){
    S.user=session.user
    sb.from('perfiles').select('*').eq('id',session.user.id).single().then(function(r2){
      S.perfil=r2.data;loadAll()
    })
  }
})
</script>
